<body><div id="app"></div>
<script type="module">
const root=document.getElementById('app');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const p=(x,y)=>({x,y}),d=(a,b)=>Math.hypot(b.x-a.x,b.y-a.y),mid=(a,b)=>p((a.x+b.x)/2,(a.y+b.y)/2);
const v=(a,b)=>p(b.x-a.x,b.y-a.y),cross=(a,b)=>a.x*b.y-a.y*b.x,dot=(a,b)=>a.x*b.x+a.y*b.y;
function makePuzzle(id,title,epithet,difficulty,description,base,legs,colors){
 let a=p(0,0),b=p(base[0],0),c=p(base[0],base[1]);
 const first={id:'I',pts:[a,b,c],right:1,color:colors[0],givens:[{a,b,value:base[0]},{a:b,b:c,value:base[1]}]};
 const triangles=[first];let previous=first,edge={a,b:c};
 for(let i=0;i<legs.length;i++){
  const P=edge.a,Q=edge.b,vec=v(P,Q),len=d(P,Q);
  const other=previous.pts.find(z=>z!==P&&z!==Q);
  const sign=cross(vec,v(mid(P,Q),other))>=0?-1:1;
  const R=p(P.x-sign*vec.y/len*legs[i],P.y+sign*vec.x/len*legs[i]);
  const t={id:['II','III','IV','V','VI'][i],pts:[P,Q,R],right:0,color:colors[i+1],givens:[{a:P,b:R,value:legs[i]}]};
  triangles.push(t);previous=t;edge={a:Q,b:R};
 }
 const result={id,title,epithet,difficulty,description,triangles,target:edge,solution:d(edge.a,edge.b)};
 for(const t of triangles){
  const O=t.pts[t.right],two=t.pts.filter((_,i)=>i!==t.right);
  if(Math.abs(dot(v(O,two[0]),v(O,two[1])))>1e-8)throw Error('Invalid right angle');
  for(const g of t.givens)if(Math.abs(d(g.a,g.b)-g.value)>1e-8)throw Error('Invalid labelled length');
 }
 return result;
}
const puzzles=[
 makePuzzle('first-fall','The First Fall','THE APPRENTICE','INTRODUCTORY','Three right triangles. One final length. Discover how each measurement becomes the key to another.',[3,4],[12,6],['#d7ae69','#88abb2','#b47763']),
 makePuzzle('labyrinth','The Geometer’s Labyrinth','THE ARCHITECT','CHALLENGE','Five connected triangles. More turns, more hidden lengths, one final side to uncover.',[6,8],[5,7,9,4],['#d7ae69','#7fa7a1','#b77f70','#909db6','#baa475'])
];
let current=puzzles[0],selected=null,animating=false,visible=true,finishTimer=null,screen='home';
const header=()=>'<header><a class="brand" href="#home"><span class="seal">△</span><span>PYTHAGORAS <em>PILE UP</em></span></a><nav><a href="#home">THE AGORA</a><a href="#puzzles">THE CHALLENGES</a></nav><span class="header-note">A GEOMETER’S TRIAL</span></header>';
const footer=()=>'<footer><span>△ PYTHAGORAS PILE UP</span><span>Inspired by the original classroom activity at greatmathsteachingideas.com and a design by @mrallanmaths.</span><span>MADE FOR CURIOUS MINDS</span></footer>';
function home(gallery=false){
 screen='home';clearTimeout(finishTimer);
 root.innerHTML=header()+`<main><section class="hero"><div><div class="eyebrow">— AN ANCIENT PUZZLE · A MODERN CHALLENGE</div><h1>When triangles<br><em>fall into place.</em></h1><p class="lead">In the footsteps of Pythagoras, follow a trail of hidden lengths. Each answer unlocks the next. Can you uncover the final side?</p><div class="actions"><button class="btn primary" data-puzzle="first-fall">BEGIN THE TRIAL &nbsp; →</button><button class="btn plain" data-gallery>EXPLORE THE CHALLENGES ↗</button></div><p class="footnote">✦ &nbsp; RIGHT-ANGLED TRIANGLES. ONE HIDDEN ANSWER.</p></div><div class="illustration"><svg viewBox="0 0 470 430" role="img" aria-label="Decorative arrangement of coloured geometric triangles"><polygon points="75,260 285,260 285,116" fill="#d7ae69" stroke="#433c31" stroke-width="3"/><polygon points="285,116 285,260 402,190" fill="#7fa7a1" stroke="#433c31" stroke-width="3"/><polygon points="75,260 285,260 184,370" fill="#b77f70" stroke="#433c31" stroke-width="3"/><polygon points="134,73 285,116 75,260" fill="#a7a0bb" stroke="#433c31" stroke-width="3"/><g fill="#433c31" font-size="21" font-family="Georgia,serif"><text x="170" y="249">a</text><text x="308" y="222">b</text><text x="194" y="311">c</text><text x="194" y="102">?</text></g><path d="M47 367H425M47 375H425" stroke="#ae9e80"/></svg><span class="illustration-caption">FIG. I — THE BEAUTY OF CONNECTION</span></div></section><div class="meander"></div><section class="section"><div class="section-title"><div class="eyebrow">THE METHOD</div><h2>Three steps to discovery</h2><p>Simple in principle. Surprisingly deep in practice.</p></div><div class="steps"><article><span class="number">I.</span><h3>Watch the fall</h3><p>Right-angled triangles tumble onto a carefully constructed geometric tablet.</p></article><article><span class="number">II.</span><h3>Follow the clues</h3><p>Known lengths lead to unknown lengths. Discover where the chain begins.</p></article><article><span class="number">III.</span><h3>Find the final side</h3><p>Use Pythagoras' theorem to connect the pieces and reach the target.</p></article></div></section><section class="section" id="challenges"><div class="section-title"><div class="eyebrow">CHOOSE YOUR PATH</div><h2>The challenges</h2><p>Two handcrafted piles, each geometrically exact.</p></div><div class="cards">${puzzles.map((x,i)=>`<button class="challenge-card" data-puzzle="${x.id}"><span class="card-index">0${i+1} / ${x.epithet}</span><span class="card-mark" aria-hidden="true">${i?'⌁':'△'}</span><span class="card-title">${x.title}</span><span class="card-description">${x.description}</span><span class="card-footer"><span>${x.triangles.length} TRIANGLES</span><span>${x.difficulty} ↗</span></span></button>`).join('')}</div></section></main>`+footer();
 bind();if(gallery)requestAnimationFrame(()=>document.getElementById('challenges')?.scrollIntoView({behavior:reduced.matches?'instant':'smooth'}));
}
function el(name,attrs={},text=''){const x=document.createElementNS('http://www.w3.org/2000/svg',name);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,String(v)));if(text)x.textContent=text;return x;}
function labelPoint(a,b,cent,offset){const M=mid(a,b),vec=v(a,b),len=d(a,b);let nx=-vec.y/len,ny=vec.x/len;if((M.x-cent.x)*nx+(M.y-cent.y)*ny<0){nx=-nx;ny=-ny;}return p(M.x+offset*nx,M.y+offset*ny);}
function draw(){
 const points=current.triangles.flatMap(t=>t.pts),xs=points.map(x=>x.x),ys=points.map(x=>x.y);
 const minX=Math.min(...xs),minY=Math.min(...ys),maxX=Math.max(...xs),maxY=Math.max(...ys);
 const pad=Math.max(maxX-minX,maxY-minY)*.28+3;
 const bounds={x:minX-pad,y:minY-pad,w:maxX-minX+2*pad,h:maxY-minY+2*pad};
 const center=p(bounds.x+bounds.w/2,bounds.y+bounds.h/2);
 const svg=el('svg',{viewBox:`${bounds.x} ${bounds.y} ${bounds.w} ${bounds.h}`,role:'img','aria-label':`A pile of ${current.triangles.length} exactly right-angled triangles with known side lengths in centimetres and a target x.`});
 const grid=el('g',{'aria-hidden':'true'});
 for(let x=Math.floor(bounds.x/5)*5;x<bounds.x+bounds.w;x+=5)grid.append(el('line',{x1:x,y1:bounds.y,x2:x,y2:bounds.y+bounds.h,class:'grid-line'}));
 for(let y=Math.floor(bounds.y/5)*5;y<bounds.y+bounds.h;y+=5)grid.append(el('line',{x1:bounds.x,y1:y,x2:bounds.x+bounds.w,y2:y,class:'grid-line'}));
 svg.append(grid);
 current.triangles.forEach((t,i)=>{
  const g=el('g',{class:'piece','data-id':t.id,style:`--delay:${i*340}ms;--angle:${i%2?-11:9}deg`});
  g.append(el('polygon',{points:t.pts.map(x=>`${x.x},${x.y}`).join(' '),fill:t.color}));
  const O=t.pts[t.right],two=t.pts.filter((_,j)=>j!==t.right),step=Math.min(d(O,two[0]),d(O,two[1]))*.11;
  const U=v(O,two[0]),V=v(O,two[1]);const ux=U.x/d(O,two[0])*step,uy=U.y/d(O,two[0])*step,vx=V.x/d(O,two[1])*step,vy=V.y/d(O,two[1])*step;
  g.append(el('path',{d:`M${O.x+ux} ${O.y+uy}L${O.x+ux+vx} ${O.y+uy+vy}L${O.x+vx} ${O.y+vy}`}));
  g.append(el('title',{},`Right-angled triangle ${t.id}`));g.addEventListener('click',()=>select(t.id));svg.append(g);
 });
 const labels=el('g',{class:'labels waiting'}),placed=[];
 current.triangles.forEach(t=>t.givens.forEach(s=>{
  const pos=labelPoint(s.a,s.b,center,1.85);
  for(let attempt=0;attempt<9;attempt++){
   if(!placed.some(z=>d(z,pos)<3.5)&&!points.some(z=>d(z,pos)<1.2))break;
   pos.x+=(attempt%2?1:-1)*1.25;pos.y+=(attempt%2?1:-1)*1.3;
  }
  placed.push({...pos});labels.append(el('text',{x:pos.x,y:pos.y,'text-anchor':'middle','dominant-baseline':'middle',class:'measure'},`${s.value} cm`));
 }));
 const target=labelPoint(current.target.a,current.target.b,center,2.3);
 labels.append(el('circle',{cx:target.x,cy:target.y,r:2.35,class:'goal-circle'}));
 labels.append(el('text',{x:target.x,y:target.y,'text-anchor':'middle','dominant-baseline':'middle',class:'goal'},'x'));
 svg.append(labels);document.getElementById('diagram').replaceChildren(svg);
 if(!visible)labels.classList.add('hidden-labels');
 if(reduced.matches){labels.classList.remove('waiting');animating=false;document.getElementById('skip').hidden=true;updateInspector();return;}
 animating=true;svg.classList.add('animating');document.getElementById('skip').hidden=false;document.getElementById('replay').disabled=true;
 updateInspector();clearTimeout(finishTimer);finishTimer=setTimeout(stopAnimation,current.triangles.length*340+1150);
}
function stopAnimation(){clearTimeout(finishTimer);animating=false;document.querySelector('#diagram svg')?.classList.remove('animating');document.querySelector('.labels')?.classList.remove('waiting');document.getElementById('skip').hidden=true;document.getElementById('replay').disabled=false;updateInspector();}
function select(id){if(animating)return;selected=selected===id?null:id;document.querySelectorAll('.piece').forEach(e=>{e.classList.toggle('selected',selected===e.dataset.id);e.classList.toggle('dimmed',!!selected&&selected!==e.dataset.id)});updateInspector();}
function updateInspector(){
 const node=document.getElementById('inspector');if(!node)return;
 const t=current.triangles.find(x=>x.id===selected);
 if(animating)node.innerHTML='<span class="kicker">THE PILE IS FORMING</span><h3>Watch the geometry settle.</h3><p>Each triangle lands in its mathematically correct position. The measurements appear at the end.</p>';
 else if(t)node.innerHTML=`<span class="kicker">TRIANGLE ${t.id} · SELECTED</span><h3>Examine this triangle</h3><p>Find the two shorter sides and its hypotenuse. Think about which lengths can be deduced from the shared edges.</p><p class="hint">${t.givens.length?'Given here: '+t.givens.map(g=>g.value+' cm').join(', '):'Look to the neighbouring triangles for shared measurements.'}</p><button id="clear">CLEAR SELECTION ↗</button>`;
 else node.innerHTML='<span class="kicker">THE GEOMETER’S NOTES</span><h3>Where would you begin?</h3><p>Look for a triangle with two known sides. Each new length can become a clue for the next.</p><p class="hint">TIP · Tap a coloured triangle to examine it.</p>';
 document.getElementById('clear')?.addEventListener('click',()=>select(selected));
}
function openPuzzle(id){
 const puzzle=puzzles.find(x=>x.id===id);if(!puzzle)return;current=puzzle;selected=null;visible=true;screen=id;clearTimeout(finishTimer);
 if(location.hash.slice(1)!==id)history.pushState(null,'','#'+id);
 const index=puzzles.indexOf(puzzle);
 root.innerHTML=header()+`<main class="challenge-main"><div class="challenge-heading"><a class="back" href="#puzzles">← ALL CHALLENGES</a><span class="chapter">CHALLENGE 0${index+1} / 0${puzzles.length}</span><h1>${puzzle.title}</h1><p>${puzzle.description}</p></div><div class="challenge-layout"><div class="tablet"><div class="tablet-bar"><span><span class="symbol">✧</span> THE GEOMETER’S TABLET</span><span class="tablet-controls"><button id="replay" class="small-btn" title="Replay animation" aria-label="Replay animation">↻</button><button id="labels-toggle" class="small-btn" title="Show or hide measurements" aria-label="Show or hide measurements" aria-pressed="false">◉</button></span></div><div class="tablet-inside"><div id="diagram"></div><button id="skip" class="skip" hidden>SKIP ANIMATION →</button><div class="diagram-caption"><span>✦ ALL TRIANGLES ARE RIGHT-ANGLED</span><span>GEOMETRY DRAWN TO SCALE</span></div></div></div><aside class="side"><div class="kicker">${puzzle.epithet} · ${puzzle.difficulty}</div><div class="rule"></div><h2>Find the final <em>length.</em></h2><p class="description">The marked side <strong>x</strong> is waiting to be discovered. Use the given measurements and Pythagoras’ theorem to trace the chain.</p><div class="facts"><div><span>TRIANGLES</span><strong>${puzzle.triangles.length}</strong></div><div><span>GIVEN LENGTHS</span><strong>${puzzle.triangles.reduce((n,t)=>n+t.givens.length,0)}</strong></div></div><div class="inspector" id="inspector" aria-live="polite"></div><div class="side-bottom"><strong>✦ PASS A · EXPLORE THE PILE</strong><p>Answer entry, hints and worked solutions are planned for Pass B.</p></div></aside></div><div class="challenge-bottom"><span>ANCIENT WISDOM. FRESH PERSPECTIVES.</span><button data-puzzle="${puzzles.find(x=>x.id!==id).id}">TRY THE OTHER CHALLENGE →</button></div></main>`+footer();
 bind();document.getElementById('replay').addEventListener('click',()=>{selected=null;draw()});document.getElementById('skip').addEventListener('click',stopAnimation);
 document.getElementById('labels-toggle').addEventListener('click',e=>{visible=!visible;document.querySelector('.labels')?.classList.toggle('hidden-labels',!visible);e.currentTarget.setAttribute('aria-pressed',String(!visible))});
 draw();window.scrollTo({top:0,behavior:'instant'});
}
function bind(){document.querySelectorAll('[data-puzzle]').forEach(e=>e.addEventListener('click',()=>openPuzzle(e.dataset.puzzle)));document.querySelectorAll('[data-gallery]').forEach(e=>e.addEventListener('click',()=>{history.pushState(null,'','#puzzles');home(true)}));}
function route(){const id=location.hash.slice(1);if(puzzles.some(x=>x.id===id))openPuzzle(id);else home(id==='puzzles')}
window.addEventListener('hashchange',route);window.addEventListener('popstate',route);route();
</script></body></html>
